<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-only -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rheia themes</title>
<link rel="icon" href="../webapp/icon-192.png">
<style>
  :root { --bg: #0e0e10; --card: #18181c; --edge: #2a2a30; --ink: #ececf0; --muted: #8e8e98; --accent: #ff6a2a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1340px; margin: 0 auto; padding: 40px 16px; }
  h1 { font-size: 36px; letter-spacing: .04em; margin: 0; }
  h1 a { color: inherit; text-decoration: none; }
  .lede { color: var(--muted); margin: 8px 0 24px; max-width: 640px; }
  h2 { font-size: 18px; letter-spacing: .08em; margin: 28px 0 10px; }
  .row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; }
  figure { margin: 0; flex: 0 0 auto; }
  img { display: block; width: 240px; height: 240px; image-rendering: pixelated; border: 1px solid var(--edge); border-radius: 8px; }
  figcaption { color: var(--muted); font-size: 12px; letter-spacing: .08em; margin-top: 4px; }
  .theme { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; color: var(--muted); font-size: 13px; }
</style>
<!--THEME-->
</head>
<body>
<main>
  <h1><a href="../">RHEIA</a> · THEMES</h1>
  <p class="lede">The FM-1's screen in each Rheia theme, drawn by the firmware itself (the host tests render these on
  every build). Pick one in MENU (hold HOME) &gt; COLOR; a new FM-1 starts on ASH.</p>
  <div class="theme"><span>This site in:</span><div data-theme-picker></div></div>
<!--THEMES-->
</main>
</body>
</html>
